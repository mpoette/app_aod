# Site Nginx : reçoit les visiteurs de aod.scitoul.fr, demande le mot de passe,
# puis transmet à l'app Streamlit qui écoute en local sur le port 8501.
# À copier dans /etc/nginx/sites-available/vignettes-aod (voir deploy/README.md).
# Certbot ajoutera lui-même la partie HTTPS (port 443) à ce fichier.

server {
    listen 80;
    server_name aod.scitoul.fr;

    auth_basic "Vignettes AOD";
    auth_basic_user_file /etc/nginx/.htpasswd-aod;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamlit garde une connexion WebSocket ouverte avec le navigateur
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
