[project]
name = "vignettes-aod"
version = "0.1.0"
description = "Explorateur Streamlit des vignettes cliniques sur la gestion préopératoire des anticoagulants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=6.0",
    "streamlit>=1.46",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
